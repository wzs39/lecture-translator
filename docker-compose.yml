# Fixed project name: the launcher can be installed anywhere (e.g.
# %%LOCALAPPDATA%%\LectureTranslator) and still reuse the same stack,
# networks, and volumes instead of creating a second one.
name: lecture-translator

services:
  ollama:
    image: ollama/ollama:latest
    container_name: lt-ollama
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app:
    build: ./app
    container_name: lt-app
    ports:
      - "127.0.0.1:8000:8000"  # loopback only: the page/API stays off the LAN
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:4b-instruct
    volumes:
      - recordings:/srv/data
    mem_limit: 512m
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama:
  recordings:
